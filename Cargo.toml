[package]
name = "blockchain_rust"
authors = ["William Quao <paawilliam.quao@gmail.com>"]
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
ring = "0.16.20"
data-encoding = "2.3.2"
num-bigint = "0.4.3"
sled = "0.34.7"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3.3"
structopt = "0.3.25"
clap = "2.34.0"
bs58 = "0.4.0"
uuid = { version = "0.8.2", features = ["v4"]}
log = "0.4.14"
env_logger = "0.9.0"
serde_json = "1.0"
once_cell = "1.9.0"
sha2 = "0.9.8"
ripemd = "0.1.1"


[dev-dependencies]
assert_cmd = "0.11.0"